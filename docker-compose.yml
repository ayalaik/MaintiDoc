services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  db:
    image: pgvector/pgvector:pg16
    container_name: maintidoc_db
    environment:
      POSTGRES_USER: maintidoc
      POSTGRES_PASSWORD: motdepasse
      POSTGRES_DB: maintidoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  qdrant_data:
  pgdata:
